# cargo-deny policy for this crate, run by .github/workflows/security.yml.

[graph]
all-features = true

[advisories]
# Unmaintained crates deep in the Tauri and GTK tree cannot be replaced from
# here, so only direct dependencies fail the check. Vulnerabilities always fail.
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
# Tauri pulls in several versions of the same crates; that is reviewed through
# Dependabot rather than failing the scan.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
