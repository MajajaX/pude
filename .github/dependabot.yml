version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A week lets the ecosystem catch a compromised or broken release first.
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    # A week lets the ecosystem catch a compromised or broken release first.
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      minor-and-patch:
        update-types: [minor, patch]

  # Does not see the `docker://rhysd/actionlint` digest in ci.yml; update it by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A week lets the ecosystem catch a compromised or broken release first.
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
