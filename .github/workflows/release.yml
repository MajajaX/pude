name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A second push of the same tag waits instead of publishing concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The build and publish jobs never restore caches, so a poisoned cache cannot
# reach a signed artifact. Only the reused CI test jobs use caches.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/release-version.mjs release-check "$GITHUB_REF_NAME"

  # The same web, tooling and Rust test jobs every pull request must pass.
  ci:
    permissions:
      contents: read
      pull-requests: read # CI's change detection lists pull request files
    uses: ./.github/workflows/ci.yml

  build-macos:
    needs: [verify, ci]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # Signing secrets are only given to the steps that sign, never to
      # dependency install scripts.
      - run: npm ci
      - run: rustup toolchain install

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          keychain="$RUNNER_TEMP/pude-release.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          existing_keychains=()
          while IFS= read -r line; do
            path="${line//\"/}"
            existing_keychains+=("${path#"${path%%[![:space:]]*}"}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"
          echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run release:macos

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            dist/release-macos/pude-macos-arm64.dmg
            dist/release-macos/pude-macos-arm64.app.tar.gz
            dist/release-macos/pude-macos-arm64.app.tar.gz.sig
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/pude-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"

  build-windows:
    needs: [verify, ci]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: rustup toolchain install
      - name: Build and sign the update package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --bundles nsis --config src-tauri/tauri.release.conf.json
      - run: node scripts/collect-release-bundle.mjs windows dist/release-windows --bundle-root apps/desktop/src-tauri/target
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            dist/release-windows/pude-windows-x64-setup.exe
            dist/release-windows/pude-windows-x64-setup.exe.sig
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Creates the GitHub Release and uploads its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { capture = 1; next }
            /^## \[/ { capture = 0 }
            capture
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }

      - name: Assemble release files
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md release/
          node scripts/write-update-manifest.mjs release "$GITHUB_REF_NAME" release-notes.md
          cd release
          node ../scripts/write-checksums.mjs create SHA256SUMS.txt \
            pude-windows-x64-setup.exe pude-macos-arm64.dmg \
            LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "pude $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:verify-url -- "https://github.com/MajajaX/pude/releases/tag/$GITHUB_REF_NAME"
