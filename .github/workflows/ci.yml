name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request and main runs are cancelled; every release run finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # Lists the files a pull request changes
    outputs:
      # Release calls (tag refs) always run everything. Pull requests and pushes
      # to main run what the changed files affect.
      web: ${{ github.ref_type == 'tag' || steps.filter.outputs.web == 'true' }}
      rust: ${{ github.ref_type == 'tag' || steps.filter.outputs.rust == 'true' }}
      security: ${{ github.ref_type == 'tag' || steps.filter.outputs.security == 'true' }}
      workflows: ${{ github.ref_type == 'tag' || steps.filter.outputs.workflows == 'true' }}
      site: ${{ steps.filter.outputs.site == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        if: github.ref_type != 'tag'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - 'apps/**'
              - 'shared/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'LICENSE'
              - 'THIRD_PARTY_NOTICES.md'
              - 'THIRD_PARTY_LICENSES.md'
              - 'wrangler.jsonc'
              - '.github/workflows/ci.yml'
            rust:
              - 'apps/desktop/src-tauri/**'
              - 'examples/plugins/**'
              - 'scripts/run-rust-tests.mjs'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            security:
              - 'apps/desktop/src-tauri/Cargo.lock'
              - 'package-lock.json'
              - 'apps/desktop/src-tauri/deny.toml'
              - '.github/workflows/security.yml'
            workflows:
              - '.github/**'
            site:
              - 'apps/web/**'
              - 'shared/**'
              - 'package-lock.json'
              - 'wrangler.jsonc'

  web:
    name: Web and tooling (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The supported engine lines in package.json; 24 is the development baseline.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: matrix.node == 24
        run: npm run release:tooling:self-test

      - name: Read Playwright version
        if: matrix.node == 24
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: matrix.node == 24
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Make apt downloads fail fast and retry
        if: matrix.node == 24
        run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
      - name: Install Playwright Chromium
        if: matrix.node == 24 && steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: bash scripts/ci-retry.sh 3 240 npx playwright install --with-deps --only-shell chromium
      - name: Install Playwright system dependencies
        if: matrix.node == 24 && steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: bash scripts/ci-retry.sh 3 240 npx playwright install-deps chromium
      - if: matrix.node == 24
        run: npm run test:e2e --workspace @pude/desktop
      - if: failure() && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          if-no-files-found: ignore

  rust-format:
    name: Rust formatting
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rustup toolchain install
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
          bash scripts/ci-retry.sh 3 120 sudo apt-get update
          bash scripts/ci-retry.sh 3 240 sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
          # Pull requests reuse the main branch cache without adding their own entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Tauri embeds the built frontend at compile time.
      - run: npm run desktop:build
      - name: Rust lints
        run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      # Runs each test in its own process so process-group tests cannot disturb each other.
      - run: node scripts/run-rust-tests.mjs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-test-diagnostics-${{ matrix.os }}
          path: rust-test-diagnostics.log

  security:
    name: Security
    needs: changes
    if: needs.changes.outputs.security == 'true'
    permissions:
      contents: read
    # actionlint cannot parse the `$/` self-repository form yet (rhysd/actionlint#711).
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository]

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.0
          advanced-security: false
          annotations: true

  # The single required status check for branch protection.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, web, rust-format, rust, security, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A CI job finished with: $result" >&2; exit 1 ;;
            esac
          done

  # Deploys only the commit whose website checks just passed. Opt in by setting the
  # WEBSITE_DEPLOY repository variable to true (see docs/releasing.md).
  deploy-website:
    name: Deploy website
    needs: [changes, web]
    if: >-
      vars.WEBSITE_DEPLOY == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.site == 'true' && needs.web.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: website
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run web:build
        env:
          VITE_RELEASE_URL: ${{ vars.VITE_RELEASE_URL }}
      - run: npx --yes wrangler@4.158.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
