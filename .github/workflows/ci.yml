name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run release:tooling:self-test

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Tauri embeds the built frontend at compile time.
      - run: npm run desktop:build
      # Runs each test in its own process so process-group tests cannot disturb each other.
      - run: node scripts/run-rust-tests.mjs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-diagnostics-${{ matrix.os }}
          path: rust-test-diagnostics.log
